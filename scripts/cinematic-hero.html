<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#080b14}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script></head><body><script type="module">
import * as THREE from 'three';

const width=1440,height=900;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(width,height);
renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#080b14');
const camera=new THREE.PerspectiveCamera(38,width/height,.1,100);
camera.position.set(0,0,10);

// Large luminous studio panels give the metal real, continuous reflections.
const studio=new THREE.Scene();
studio.background=new THREE.Color('#252b38');
function panel(color,intensity,position,scale){
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(...scale),new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(intensity),side:THREE.DoubleSide}));
 mesh.position.set(...position);mesh.lookAt(0,0,0);studio.add(mesh);
}
panel('#d8e8ff',7,[-4,4,3],[3,9]);
panel('#ffffff',9,[2,5,-2],[8,2]);
panel('#536bff',5,[5,0,2],[4,7]);
panel('#ff9c53',7,[-3,-2,-4],[2,8]);
panel('#dcefff',5,[0,-4,2],[7,1]);
panel('#5e27ff',3,[4,1,-4],[3,8]);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(studio,.045,.1,100,{size:512}).texture;

const sculpture=new THREE.Group();
scene.add(sculpture);
const segments=480,sides=64;
const positions=new Float32Array((segments+1)*(sides+1)*3);
const indices=[];
for(let i=0;i<segments;i++)for(let j=0;j<sides;j++){const a=i*(sides+1)+j,b=a+sides+1;indices.push(a,b,a+1,b,b+1,a+1);}
const geometry=new THREE.BufferGeometry();
geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
geometry.setIndex(indices);
const material=new THREE.MeshPhysicalMaterial({color:0xe5e8ee,metalness:1,roughness:.2,clearcoat:1,clearcoatRoughness:.15,iridescence:.65,iridescenceIOR:1.45,iridescenceThicknessRange:[130,360],side:THREE.DoubleSide,envMapIntensity:1.5});
const ribbon=new THREE.Mesh(geometry,material);
sculpture.add(ribbon);

const back=new THREE.Mesh(new THREE.PlaneGeometry(40,25),new THREE.ShaderMaterial({
 uniforms:{time:{value:0}},
 vertexShader:'varying vec2 uvv;void main(){uvv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec2 uvv;uniform float time;void main(){vec2 p=uvv;float a=exp(-length((p-vec2(.67,.5))*vec2(4.,3.))*4.);float b=exp(-length((p-vec2(.87,.25))*vec2(5.,4.))*5.);vec3 c=vec3(.011,.015,.025)+a*vec3(.055,.073,.20)+b*vec3(.07,.025,.015);gl_FragColor=vec4(c,1.);}'
}));
back.position.z=-5;scene.add(back);

function path(u,t){const r=1.65+.36*Math.cos(3*u+t*.32);return new THREE.Vector3(r*Math.cos(2*u),r*Math.sin(2*u),.65*Math.sin(3*u));}
function renderFrame(frame){
 const phase=frame/288*Math.PI*2;
 const t=.45*Math.sin(phase);
 const vector=new THREE.Vector3();
 for(let i=0;i<=segments;i++){
   const u=i/segments*Math.PI*2;
   const point=path(u,t),tangent=path(u+.001,t).sub(path(u-.001,t)).normalize();
   const normal=new THREE.Vector3(-Math.cos(2*u),-Math.sin(2*u),.4*Math.sin(3*u)).normalize();
   const binormal=new THREE.Vector3().crossVectors(tangent,normal).normalize();normal.crossVectors(binormal,tangent).normalize();
   const twist=u+.3*Math.sin(phase+u*2);
   for(let j=0;j<=sides;j++){
     const v=j/sides*Math.PI*2;
     const a=.57*Math.cos(v),b=.115*Math.sin(v);
     vector.copy(point).addScaledVector(normal,a*Math.cos(twist)-b*Math.sin(twist)).addScaledVector(binormal,a*Math.sin(twist)+b*Math.cos(twist));
     const k=(i*(sides+1)+j)*3;positions[k]=vector.x;positions[k+1]=vector.y;positions[k+2]=vector.z;
   }
 }
 geometry.attributes.position.needsUpdate=true;geometry.computeVertexNormals();
 sculpture.position.set(1.65,.1+.14*Math.sin(phase),0);
 sculpture.rotation.set(.38+.32*Math.sin(phase),phase,.35+.24*Math.cos(phase));
 sculpture.scale.setScalar(1.45+.10*Math.sin(phase));
 scene.environmentRotation.set(.1*Math.cos(phase),phase*.6,.1*Math.sin(phase));
 // One complete turn of the lighting environment makes the loop seamless.
 scene.environmentRotation.y=phase;
 camera.position.z=10+.35*(1-Math.cos(phase));
 renderer.render(scene,camera);
}
window.renderFrame=renderFrame;
renderFrame(0);window.ready=true;
</script></body></html>
